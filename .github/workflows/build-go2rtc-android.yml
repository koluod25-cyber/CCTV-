
name: Build go2rtc Android binary (test)

on:
  workflow_dispatch:
  push:
    branches:
      - "uji/integrasi-go2rtc-apk"
    paths:
      - ".github/workflows/build-go2rtc-android.yml"

permissions:
  contents: read

jobs:
  build-go2rtc-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout go2rtc source
        uses: actions/checkout@v4
        with:
          repository: AlexxIT/go2rtc
          ref: v1.9.14
          path: go2rtc-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go2rtc-src/go.sum

      - name: Build Android ARM64 binary
        working-directory: go2rtc-src
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: |
          go version
          go build -trimpath -ldflags="-s -w" -o ../go2rtc-android-arm64 .
          test -s ../go2rtc-android-arm64
          file ../go2rtc-android-arm64
          ls -lh ../go2rtc-android-arm64

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: go2rtc-android-arm64-test
          path: go2rtc-android-arm64
          if-no-files-found: error
          retention-days: 7
          
