name: Build CCTV Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          rm -rf "$ANDROID_HOME/ndk/27.1.12297006"

          for attempt in 1 2 3; do
            echo "Installing NDK attempt $attempt..."

            rm -rf "$ANDROID_HOME/ndk/27.1.12297006"

            if "$SDKMANAGER" --install "ndk;27.1.12297006"; then
              if [ -f "$ANDROID_HOME/ndk/27.1.12297006/source.properties" ]; then
                echo "NDK 27.1.12297006 installed successfully."
                break
              fi
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts."
              exit 1
            fi

            echo "Retrying NDK installation..."
            sleep 10
          done

          echo "Installed NDK:"
          cat "$ANDROID_HOME/ndk/27.1.12297006/source.properties"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cctv-universal-monitor-apk
          path: android/app/build/outputs/apk/release/*.apk