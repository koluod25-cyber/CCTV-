name: Build CCTV Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android 
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="27.1.12297006"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          NDK_ZIP="/tmp/android-ndk-r27b-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r27b-linux.zip"

          if [ -f "$NDK_DIR/source.properties" ]; then
            echo "NDK $NDK_VERSION is already installed."
          else
            rm -rf "$NDK_DIR"
            rm -f "$NDK_ZIP"

            echo "Downloading Android NDK r27b directly from Google..."

            curl --fail --location --show-error --silent \
              --retry 6 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 900 \
              "$NDK_URL" \
              --output "$NDK_ZIP"

            echo "Validating NDK archive..."
            unzip -t "$NDK_ZIP" >/dev/null

            echo "Extracting NDK..."
            mkdir -p "$ANDROID_HOME/ndk"
            unzip -q "$NDK_ZIP" -d "$ANDROID_HOME/ndk"

            if [ ! -f "$NDK_DIR/source.properties" ]; then
              echo "NDK extraction completed but source.properties was not found."
              find "$ANDROID_HOME/ndk" -maxdepth 2 \
                -type f \
                -name source.properties \
                -print
              exit 1
            fi
          fi

          echo "Installed NDK:"
          cat "$NDK_DIR/source.properties"

          rm -f "$NDK_ZIP"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cctv-universal-monitor-apk
          path: android/app/build/outputs/apk/release/*.apk