name: Build CCTV Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Go for go2rtc
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Compile go2rtc for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch v1.9.14 \
            https://github.com/AlexxIT/go2rtc.git \
            /tmp/go2rtc

          cd /tmp/go2rtc

          GOOS=android \
          GOARCH=arm64 \
          CGO_ENABLED=0 \
          go build \
            -trimpath \
            -ldflags="-s -w -checklinkname=0" \
            -o "$GITHUB_WORKSPACE/go2rtc-android-arm64" \
            .

          test -s "$GITHUB_WORKSPACE/go2rtc-android-arm64"
          file "$GITHUB_WORKSPACE/go2rtc-android-arm64"

      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="27.1.12297006"

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "Locating Android SDK command-line tools..."

          SDKMANAGER=""

          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/11.0/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in standard Android SDK locations."
            echo "Searching Android SDK..."
            find "$ANDROID_HOME" -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "Adding sdkmanager to PATH..."
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          export PATH="$SDKMANAGER_DIR:$ANDROID_HOME/platform-tools:$PATH"

          echo "Checking sdkmanager..."
          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Installing Android NDK ${NDK_VERSION}..."
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" --sdk_root="$ANDROID_HOME"

          echo "Checking installed NDK..."
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"

          if [ ! -f "$NDK_DIR/source.properties" ]; then
            echo "ERROR: Android NDK ${NDK_VERSION} was not installed correctly."
            echo "Available NDK versions:"
            find "$ANDROID_HOME/ndk" -maxdepth 2 \
              -name source.properties \
              -print || true
            exit 1
          fi

          echo "Android NDK ${NDK_VERSION} installed successfully."
          cat "$NDK_DIR/source.properties"
      - name: Build standalone FFmpeg for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake git \
            libtool meson nasm ninja-build pkg-config \
            python3 texinfo wget yasm

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          export API=28
          export FFMPEG_VERSION=n7.1

          test -f "$ANDROID_NDK_HOME/source.properties"

          git clone --depth 1 \
            https://github.com/MPDL-Official/ffmpeg-android-build.git \
            /tmp/ffmpeg-android-build

          cd /tmp/ffmpeg-android-build

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/build.sh")
          lines = path.read_text().splitlines(keepends=True)
          remove = (
          python3 -c 'from pathlib import Path; p=Path("scripts/build.sh"); s=p.read_text(); flags=("--enable-libfreetype", "--enable-libfribidi", "--enable-libharfbuzz", "--enable-libass", "--enable-libx265"); p.write_text("".join(line for line in s.splitlines(keepends=True) if not any(flag in line for flag in flags))); print("Opsi subtitle dan x265 dinonaktifkan jika ditemukan.")'
          PY

          bash scripts/build.sh arm64-v8a

          SOURCE="/tmp/ffmpeg-android-build/output/arm64-v8a/ffmpeg"
          test -s "$SOURCE"
          file "$SOURCE"

          TARGET="$GITHUB_WORKSPACE/ffmpeg-android-arm64"
          install -m 0755 "$SOURCE" "$TARGET"

          echo "FFmpeg berhasil dibangun: $TARGET"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Package go2rtc binary as Android native library
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$GITHUB_WORKSPACE/go2rtc-android-arm64"
          MODULE_TARGET="modules/cctv-talkback/android/src/main/jniLibs/arm64-v8a"
          APP_TARGET="android/app/src/main/jniLibs/arm64-v8a"

          test -s "$SOURCE"

          mkdir -p "$MODULE_TARGET" "$APP_TARGET"

          install -m 0755 "$SOURCE" "$MODULE_TARGET/libgo2rtc.so"
          install -m 0755 "$SOURCE" "$APP_TARGET/libgo2rtc.so"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text()

          match = re.search(r'<application\b[^>]*>', content)
          if not match:
              raise SystemExit("Tag application tidak ditemukan di AndroidManifest.xml")

          tag = match.group(0)
          tag = re.sub(
              r'\s+android:extractNativeLibs\s*=\s*["\'][^"\']*["\']',
              '',
              tag,
          )
          tag = tag[:-1] + ' android:extractNativeLibs="true">'
          content = content[:match.start()] + tag + content[match.end():]
          path.write_text(content)
          print("extractNativeLibs=true diterapkan.")
          PY

          echo "Biner sudah disalin ke modul dan aplikasi utama."
          
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify go2rtc inside APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk/release \
            -maxdepth 1 -name '*.apk' -print -quit)"

          test -n "$APK"
          test -f "$APK"

          echo "Memeriksa: $APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libgo2rtc.so'
          
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cctv-universal-monitor-apk
          path: android/app/build/outputs/apk/release/*.apk
