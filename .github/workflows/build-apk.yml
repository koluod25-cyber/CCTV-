name: Build CCTV Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="27.1.12297006"

          echo "Checking Android SDK..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Installing Android NDK ${NDK_VERSION}..."
          sdkmanager --install "ndk;${NDK_VERSION}"

          echo "Checking installed NDK..."
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"

          if [ ! -f "$NDK_DIR/source.properties" ]; then
            echo "ERROR: Android NDK ${NDK_VERSION} was not installed correctly."
            echo "Available NDK versions:"
            find "$ANDROID_HOME/ndk" -maxdepth 2 \
              -name source.properties \
              -print || true
            exit 1
          fi

          echo "Android NDK ${NDK_VERSION} installed successfully."
          cat "$NDK_DIR/source.properties"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cctv-universal-monitor-apk
          path: android/app/build/outputs/apk/release/*.apk